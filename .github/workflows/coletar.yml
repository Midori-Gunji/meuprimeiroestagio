name: Coletar vagas

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rodar coleta
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python scripts/coletar.py
      - name: Salvar vagas.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add vagas.json
          git diff --staged --quiet || git commit -m "Atualiza vagas"
          git push
      - name: Avisar vagas novas (issue)
        if: hashFiles('novas.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Novas vagas de estágio" --body-file novas.md
